name: Apply browser raise semantics patch

on:
  push:
    branches:
      - feature/emscripten-browser-semantics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/emscripten-browser-semantics
          fetch-depth: 0

      - name: Apply GREEN implementation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin feature/emscripten-browser-semantics
            git reset --hard origin/feature/emscripten-browser-semantics

            python - <<'PY'
          from pathlib import Path

          path = Path('src/emscripten.c')
          text = path.read_text()
          old = '''PuglStatus
          puglShow(PuglView* const view, const PuglShowCommand command)
          {
            (void)command;

            PuglInternals* const impl = view ? view->impl : NULL;
            if (!impl) {
              return PUGL_BAD_PARAMETER;
            }

            PuglStatus st = impl->id ? PUGL_SUCCESS : puglRealize(view);
            if (st) {
              return st;
            }

            if (!impl->mapped) {
              impl->mapped = true;
              puglSetDomVisible(impl->id, true);
              st = puglDispatchConfigure(view, PUGL_VIEW_STYLE_MAPPED);
              if (!st) {
                st = puglObscureView(view);
              }
            }

            return st;
          }
          '''.replace('          ', '')
          new = '''PuglStatus
          puglShow(PuglView* const view, const PuglShowCommand command)
          {
            PuglInternals* const impl = view ? view->impl : NULL;
            if (!impl) {
              return PUGL_BAD_PARAMETER;
            }

            PuglStatus st = impl->id ? PUGL_SUCCESS : puglRealize(view);
            if (st) {
              return st;
            }

            if (!impl->mapped) {
              impl->mapped = true;
              puglSetDomVisible(impl->id, true);
              st = puglDispatchConfigure(view, PUGL_VIEW_STYLE_MAPPED);
              if (!st) {
                st = puglObscureView(view);
              }
            }

            if (st) {
              return st;
            }

            return command == PUGL_SHOW_PASSIVE ? PUGL_SUCCESS : PUGL_FAILURE;
          }
          '''.replace('          ', '')
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected puglShow implementation not found')
          PY

            rm -f .github/workflows/automation-patch-browser-raise.yml
            git add src/emscripten.c .github/workflows/automation-patch-browser-raise.yml

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m 'Implement explicit browser raise semantics'
            if git push origin HEAD:feature/emscripten-browser-semantics; then
              exit 0
            fi

            git reset --hard HEAD^
            sleep 2
          done

          echo 'Failed to publish browser raise semantics after retries' >&2
          exit 1
