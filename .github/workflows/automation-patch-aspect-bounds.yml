name: Apply browser aspect-bound semantics patch

on:
  push:
    branches:
      - feature/emscripten-browser-semantics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/emscripten-browser-semantics
          fetch-depth: 0

      - name: Apply GREEN implementation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin feature/emscripten-browser-semantics
            git reset --hard origin/feature/emscripten-browser-semantics

            python - <<'PY'
          from pathlib import Path

          path = Path('src/emscripten.c')
          text = path.read_text()
          old = (
              "  if (hint != PUGL_MIN_SIZE && hint != PUGL_MAX_SIZE &&\n"
              "      hint != PUGL_FIXED_ASPECT) {\n"
              "    return PUGL_SUCCESS;\n"
              "  }\n"
          )
          new = (
              "  if (hint == PUGL_MIN_ASPECT || hint == PUGL_MAX_ASPECT) {\n"
              "    return PUGL_UNSUPPORTED;\n"
              "  }\n\n"
              "  if (hint != PUGL_MIN_SIZE && hint != PUGL_MAX_SIZE &&\n"
              "      hint != PUGL_FIXED_ASPECT) {\n"
              "    return PUGL_SUCCESS;\n"
              "  }\n"
          )
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected puglApplySizeHint implementation not found')
          PY

            rm -f .github/workflows/automation-patch-aspect-bounds.yml
            git add src/emscripten.c .github/workflows/automation-patch-aspect-bounds.yml

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m 'Reject unsupported browser aspect bounds'
            if git push origin HEAD:feature/emscripten-browser-semantics; then
              exit 0
            fi

            git reset --hard HEAD^
            sleep 2
          done

          echo 'Failed to publish browser aspect-bound semantics after retries' >&2
          exit 1
