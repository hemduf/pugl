name: Apply fullscreen GREEN

on:
  push:
    branches: [feature/emscripten-browser-semantics]

permissions:
  contents: write

concurrency:
  group: apply-fullscreen-green
  cancel-in-progress: true

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'stage fullscreen GREEN') || contains(github.event.head_commit.message, 'restage fullscreen GREEN')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/emscripten-browser-semantics
          fetch-depth: 0

      - name: Wait for identity sanitizer
        shell: bash
        run: |
          set -euo pipefail
          branch=feature/emscripten-browser-semantics
          for attempt in $(seq 1 24); do
            git fetch origin "$branch"
            tip="$(git rev-parse "origin/$branch")"
            if ! git log "$tip" --format='%an%x09%cn' | grep -Eq '(^|[[:space:]])hemduf([[:space:]]|$)'; then
              git reset --hard "$tip"
              exit 0
            fi
            sleep 5
          done
          echo 'Identity sanitizer did not finish in time' >&2
          exit 1

      - name: Implement browser fullscreen semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/emscripten.c')
          text = path.read_text()

          timer_marker = '\nstatic PuglBrowserTimer*\npuglFindBrowserTimer'
          if text.count(timer_marker) != 1:
              raise SystemExit('timer insertion point changed')

          fullscreen_js = r'''

          EM_JS(int,
                puglBrowserInstallFullscreen,
                (const char* selector, uintptr_t token), {
            if (typeof document === 'undefined') {
              return 0;
            }

            const element = document.querySelector(UTF8ToString(selector));
            if (!element || element.__puglFullscreen) {
              return 0;
            }

            const changed = Module['_puglEmscriptenFullscreenChanged'];
            if (typeof changed !== 'function') {
              return 0;
            }

            const handler = () => {
              changed(token, document.fullscreenElement === element ? 1 : 0);
            };

            document.addEventListener('fullscreenchange', handler, false);
            element.__puglFullscreen = handler;
            return 1;
          });

          EM_JS(void, puglBrowserUninstallFullscreen, (const char* selector), {
            if (typeof document === 'undefined') {
              return;
            }

            const element = document.querySelector(UTF8ToString(selector));
            const handler = element ? element.__puglFullscreen : null;
            if (!element || !handler) {
              return;
            }

            document.removeEventListener('fullscreenchange', handler, false);
            delete element.__puglFullscreen;
          });

          EM_JS(int, puglBrowserSetFullscreen, (const char* selector, int fullscreen), {
            if (typeof document === 'undefined') {
              return 0;
            }

            const element = document.querySelector(UTF8ToString(selector));
            if (!element) {
              return 0;
            }

            if (fullscreen) {
              if (document.fullscreenElement === element) {
                return 1;
              }

              if (document.fullscreenElement) {
                return 0;
              }

              if (document.fullscreenEnabled === false ||
                  typeof element.requestFullscreen !== 'function') {
                return -1;
              }

              try {
                const result = element.requestFullscreen();
                if (result && typeof result.catch === 'function') {
                  result.catch(() => {});
                }
                return 1;
              } catch (_) {
                return 0;
              }
            }

            if (document.fullscreenElement !== element) {
              return 1;
            }

            if (typeof document.exitFullscreen !== 'function') {
              return -1;
            }

            try {
              const result = document.exitFullscreen();
              if (result && typeof result.catch === 'function') {
                result.catch(() => {});
              }
              return 1;
            } catch (_) {
              return 0;
            }
          });
          '''
          text = text.replace(timer_marker, fullscreen_js + timer_marker, 1)

          area_marker = '\nstatic PuglArea\npuglCurrentArea'
          if text.count(area_marker) != 1:
              raise SystemExit('configure insertion point changed')

          fullscreen_callback = r'''

          static PuglStatus
          puglDispatchStyleConfigure(PuglView* const view,
                                     const PuglViewStyleFlags style)
          {
            PuglEvent event = {0};
            if (view->lastConfigure.type == PUGL_CONFIGURE) {
              event.configure = view->lastConfigure;
            } else {
              const PuglArea  size  = puglGetInitialSize(view);
              const PuglPoint point = puglGetInitialPosition(view, size);
              event.configure.x      = point.x;
              event.configure.y      = point.y;
              event.configure.width  = size.width;
              event.configure.height = size.height;
            }

            event.configure.type  = PUGL_CONFIGURE;
            event.configure.flags = 0U;
            event.configure.style = style;
            return puglDispatchEvent(view, &event);
          }

          EMSCRIPTEN_KEEPALIVE PUGL_BROWSER_EXPORT void
          puglEmscriptenFullscreenChanged(const uintptr_t token, const int fullscreen)
          {
            PuglView* const view = (PuglView*)token;
            if (!view || !view->impl || !view->impl->id) {
              return;
            }

            const PuglViewStyleFlags oldStyle =
              view->lastConfigure.type == PUGL_CONFIGURE
                ? view->lastConfigure.style
                : (view->impl->mapped ? PUGL_VIEW_STYLE_MAPPED
                                      : PUGL_VIEW_STYLE_HIDDEN);
            const PuglViewStyleFlags newStyle =
              fullscreen ? oldStyle | PUGL_VIEW_STYLE_FULLSCREEN
                         : oldStyle & ~PUGL_VIEW_STYLE_FULLSCREEN;
            if (newStyle != oldStyle) {
              (void)puglDispatchStyleConfigure(view, newStyle);
            }
          }
          '''
          text = text.replace(area_marker, fullscreen_callback + area_marker, 1)

          drop_start = '''  if ((st = puglInstallBrowserDrop(view))) {\n    puglEmscriptenUnregisterInput(view);'''
          if text.count(drop_start) != 1:
              raise SystemExit('drop registration point changed')
          install = '''  if (!puglBrowserInstallFullscreen(impl->canvasSelector, (uintptr_t)view)) {\n    puglEmscriptenUnregisterInput(view);\n    view->backend->destroy(view);\n    puglDestroyDomView(impl->id);\n    impl->id = 0U;\n    return PUGL_REGISTRATION_FAILED;\n  }\n\n  if ((st = puglInstallBrowserDrop(view))) {\n    puglBrowserUninstallFullscreen(impl->canvasSelector);\n    puglEmscriptenUnregisterInput(view);'''
          text = text.replace(drop_start, install, 1)

          dispatch_cleanup = '''  if (st) {\n    puglUninstallBrowserDrop(view);\n    puglEmscriptenUnregisterInput(view);'''
          if text.count(dispatch_cleanup) != 1:
              raise SystemExit('realize cleanup point changed')
          text = text.replace(
              dispatch_cleanup,
              '''  if (st) {\n    puglUninstallBrowserDrop(view);\n    puglBrowserUninstallFullscreen(impl->canvasSelector);\n    puglEmscriptenUnregisterInput(view);''',
              1)

          unrealize_cleanup = '''  puglUninstallBrowserDrop(view);\n  puglEmscriptenUnregisterInput(view);\n  view->backend->destroy(view);'''
          if text.count(unrealize_cleanup) != 1:
              raise SystemExit('unrealize cleanup point changed')
          text = text.replace(
              unrealize_cleanup,
              '''  puglUninstallBrowserDrop(view);\n  puglBrowserUninstallFullscreen(impl->canvasSelector);\n  puglEmscriptenUnregisterInput(view);\n  view->backend->destroy(view);''',
              1)

          style_start = text.index('PuglStatus\npuglSetViewStyle(')
          style_end = text.index('\nPuglStatus\npuglGrabFocus(', style_start)
          style_new = r'''PuglStatus
          puglSetViewStyle(PuglView* const view, const PuglViewStyleFlags flags)
          {
            const PuglViewStyleFlags supported = PUGL_VIEW_STYLE_MAPPED |
                                                 PUGL_VIEW_STYLE_HIDDEN |
                                                 PUGL_VIEW_STYLE_FULLSCREEN;

            if (!view || !view->impl) {
              return PUGL_BAD_PARAMETER;
            }

            if (flags & ~supported) {
              return PUGL_UNSUPPORTED;
            }

            if ((flags & PUGL_VIEW_STYLE_HIDDEN) &&
                (flags & PUGL_VIEW_STYLE_FULLSCREEN)) {
              return PUGL_BAD_PARAMETER;
            }

            PuglStatus st = PUGL_SUCCESS;
            if (flags & PUGL_VIEW_STYLE_HIDDEN) {
              st = puglHide(view);
            } else if (flags &
                       (PUGL_VIEW_STYLE_MAPPED | PUGL_VIEW_STYLE_FULLSCREEN)) {
              st = puglShow(view, PUGL_SHOW_PASSIVE);
            }

            if (st) {
              return st;
            }

            const bool wantFullscreen =
              (flags & PUGL_VIEW_STYLE_FULLSCREEN) != 0U;
            const bool haveFullscreen =
              (puglGetViewStyle(view) & PUGL_VIEW_STYLE_FULLSCREEN) != 0U;
            if (wantFullscreen == haveFullscreen) {
              return PUGL_SUCCESS;
            }

            if (!view->impl->id) {
              return PUGL_FAILURE;
            }

            const int result = puglBrowserSetFullscreen(
              view->impl->canvasSelector, wantFullscreen ? 1 : 0);
            return result > 0 ? PUGL_SUCCESS
                   : result < 0 ? PUGL_UNSUPPORTED
                                : PUGL_FAILURE;
          }
          '''
          text = text[:style_start] + style_new + text[style_end:]

          path.write_text(text)
          PY

          rm .github/workflows/apply-fullscreen-green.yml
          git diff --check

      - name: Commit GREEN implementation as bot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/emscripten.c .github/workflows/apply-fullscreen-green.yml
          git commit -m 'Implement browser fullscreen style semantics' -m 'GREEN for #17: map fullscreen view-style requests to the browser Fullscreen API and update Pugl configure state from fullscreenchange events, with teardown-safe listener lifetime.'
          git push origin HEAD:feature/emscripten-browser-semantics
