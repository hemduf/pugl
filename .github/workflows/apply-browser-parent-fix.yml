name: Apply browser parent formatting fix

on:
  push:
    branches: [feature/emscripten-browser-semantics]

permissions:
  contents: write

concurrency:
  group: apply-browser-parent-formatting-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/emscripten-browser-semantics
          fetch-depth: 0

      - name: Correct snprintf argument ordering
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/emscripten-browser-semantics
          git checkout -B feature/emscripten-browser-semantics origin/feature/emscripten-browser-semantics

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/emscripten.c')
          text = path.read_text()
          old = """           view->impl->id,\n           view->impl->id,\n           (uintptr_t)view->parent,\n           position.x,"""
          new = """           view->impl->id,\n           (uintptr_t)view->parent,\n           view->impl->id,\n           position.x,"""
          if old not in text:
              if new in text:
                  raise SystemExit('parent formatting fix already applied')
              raise SystemExit('expected snprintf argument sequence not found')
          path.write_text(text.replace(old, new, 1))
          PY

          git rm .github/workflows/apply-browser-parent-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/emscripten.c
          git commit -m 'Fix browser parent formatting arguments'

          for attempt in 1 2 3; do
            if git push origin HEAD:feature/emscripten-browser-semantics; then
              exit 0
            fi
            git fetch origin feature/emscripten-browser-semantics
            git rebase origin/feature/emscripten-browser-semantics
          done
          exit 1
