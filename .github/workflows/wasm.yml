name: WebAssembly

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  EMSCRIPTEN_IMAGE: emscripten/emsdk:6.0.9

jobs:
  browser-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure with Emscripten
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -u "$(id -u):$(id -g)" \
            "$EMSCRIPTEN_IMAGE" \
            emcmake cmake -S test/wasm -B build-wasm -DCMAKE_BUILD_TYPE=Release

      - name: Build browser tests
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -u "$(id -u):$(id -g)" \
            "$EMSCRIPTEN_IMAGE" \
            cmake --build build-wasm --verbose

      - name: Run tests in headless browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --directory build-wasm >/tmp/pugl-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"

          for test_name in pugl_wasm_lifecycle pugl_wasm_input; do
            dom="/tmp/${test_name}.html"
            log="/tmp/${test_name}.chrome.log"
            "$chrome" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --enable-logging=stderr \
              --v=1 \
              --virtual-time-budget=5000 \
              --dump-dom \
              "http://127.0.0.1:8123/${test_name}.html" \
              > "$dom" 2> "$log" || true

            cat "$log"
            cat "$dom"
            grep -q 'data-pugl-test="pass"' "$dom"
          done
