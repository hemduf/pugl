name: Meson

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: meson-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  MESON_VERSION: '1.11.2'
  NINJA_VERSION: '1.13.2'
  PLAYWRIGHT_VERSION: '1.62.0'

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build tools and X11 dependencies
        run: |
          python -m pip install "meson==${MESON_VERSION}" "ninja==${NINJA_VERSION}"
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev xvfb
      - name: Configure
        run: >-
          meson setup build
          -Dbuildtype=debug
          -Dbindings_cpp=disabled
          -Dcairo=disabled
          -Ddocs=disabled
          -Dexamples=disabled
          -Dinstall=disabled
          -Dopengl=disabled
          -Dstub=true
          -Dtests=enabled
          -Dvulkan=disabled
          -Dwarning_level=3
          -Dwerror=true
          -Dxcursor=disabled
          -Dxrandr=disabled
      - name: Build
        run: meson compile -C build
      - name: Test
        run: xvfb-run -a meson test -C build --print-errorlogs

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build tools
        run: python -m pip install "meson==${MESON_VERSION}" "ninja==${NINJA_VERSION}"
      - name: Configure
        run: >-
          meson setup build
          -Dbuildtype=debug
          -Dbindings_cpp=disabled
          -Dcairo=disabled
          -Ddocs=disabled
          -Dexamples=disabled
          -Dinstall=disabled
          -Dopengl=disabled
          -Dstub=true
          -Dtests=enabled
          -Dvulkan=disabled
          -Dwarning_level=3
          -Dwerror=true
      - name: Build
        run: meson compile -C build
      - name: Test
        # Keep the complete upstream suite and its timing assertions unchanged.
        # The hosted ARM image enables kernel timer coalescing for power savings,
        # which can batch Pugl's 60 Hz NSTimer qualification into a 30 Hz cadence.
        # Disable that host policy for qualification and keep the process awake.
        run: |
          sudo sysctl -w kern.timer.coalescing_enabled=0
          caffeinate -dimsu meson test -C build --print-errorlogs --num-processes 1

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install build tools
        shell: pwsh
        run: python -m pip install "meson==$env:MESON_VERSION" "ninja==$env:NINJA_VERSION"
      - name: Configure
        shell: pwsh
        run: >-
          meson setup build
          -Dbuildtype=debug
          -Dbindings_cpp=disabled
          -Dcairo=disabled
          -Ddocs=disabled
          -Dexamples=disabled
          -Dinstall=disabled
          -Dopengl=disabled
          -Dstub=true
          -Dtests=enabled
          -Dvulkan=disabled
          -Dwarning_level=3
          -Dwerror=true
      - name: Build
        shell: pwsh
        run: meson compile -C build
      - name: Test
        shell: pwsh
        run: meson test -C build --print-errorlogs

  wasm:
    name: WebAssembly / Emscripten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build tools
        run: >-
          python -m pip install
          "meson==${MESON_VERSION}"
          "ninja==${NINJA_VERSION}"
          "playwright==${PLAYWRIGHT_VERSION}"
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: '6.0.5'
          actions-cache-folder: emsdk-cache
      - name: Verify toolchain
        run: |
          emcc --version
          meson --version
          ninja --version
      - name: Configure
        run: >-
          meson setup build-wasm
          --cross-file build-aux/emscripten.ini
          -Dbindings_cpp=disabled
          -Dcairo=disabled
          -Ddocs=disabled
          -Dexamples=disabled
          -Dinstall=disabled
          -Dopengl=disabled
          -Dstub=true
          -Dtests=enabled
          -Dvulkan=disabled
      - name: Build and link tests
        run: meson compile -C build-wasm
      - name: Validate Meson subproject consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p consumer/subprojects/pugl
          git archive HEAD | tar -x -C consumer/subprojects/pugl
          cat > consumer/meson.build <<'EOF'
          project('pugl-wasm-consumer', 'c', default_options: ['c_std=c99'])
          pugl_dep = dependency('pugl-0', fallback: ['pugl', 'pugl_dep'])
          pugl_stub_dep = dependency('pugl-stub-0', fallback: ['pugl', 'pugl_stub_dep'])
          executable(
            'pugl-wasm-consumer',
            'main.c',
            dependencies: [pugl_dep, pugl_stub_dep],
            install: false,
          )
          EOF
          cat > consumer/main.c <<'EOF'
          #include <pugl/pugl.h>
          #include <pugl/stub.h>

          int
          main(void)
          {
            PuglWorld* const world = puglNewWorld(PUGL_PROGRAM, 0U);
            if (!world) {
              return 1;
            }

            PuglView* const view = puglNewView(world);
            if (!view || puglSetBackend(view, puglStubBackend())) {
              if (view) {
                puglFreeView(view);
              }
              puglFreeWorld(world);
              return 2;
            }

            puglFreeView(view);
            puglFreeWorld(world);
            return 0;
          }
          EOF
          meson setup consumer-build consumer \
            --cross-file "$GITHUB_WORKSPACE/build-aux/emscripten.ini" \
            -Dpugl:bindings_cpp=disabled \
            -Dpugl:cairo=disabled \
            -Dpugl:docs=disabled \
            -Dpugl:examples=disabled \
            -Dpugl:install=disabled \
            -Dpugl:opengl=disabled \
            -Dpugl:stub=true \
            -Dpugl:tests=disabled \
            -Dpugl:vulkan=disabled
          meson compile -C consumer-build
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify browser harness rejects failures
        shell: bash
        run: |
          set -euo pipefail
          page=build-wasm/test/wasm/pugl_wasm_harness.html
          test -f "$page"
          if python scripts/run_wasm_browser_test.py \
            "$page" \
            --query fail=1 \
            --diagnostics-dir build-wasm/browser-diagnostics/self-test; then
            echo "Browser harness failed to reject an intentional failure" >&2
            exit 1
          fi
      - name: Run browser harness
        run: >-
          python scripts/run_wasm_browser_test.py
          build-wasm/test/wasm/pugl_wasm_harness.html
          --diagnostics-dir build-wasm/browser-diagnostics/smoke
      - name: Run lifecycle browser test
        run: >-
          python scripts/run_wasm_browser_test.py
          build-wasm/test/wasm/pugl_wasm_lifecycle.html
          --passive
          --diagnostics-dir build-wasm/browser-diagnostics/lifecycle
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-browser-diagnostics
          path: build-wasm/browser-diagnostics
          if-no-files-found: ignore
