name: Apply focused X11 empty-clipboard fix

on:
  push:
    branches: [fix/x11-empty-clipboard]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: fix/x11-empty-clipboard
          fetch-depth: 0

      - name: Apply minimal GREEN and remove this transient workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin fix/x11-empty-clipboard
            git reset --hard origin/fix/x11-empty-clipboard

            python3 - <<'PY'
          from pathlib import Path

          path = Path('src/x11.c')
          text = path.read_text()
          marker = 'A failed selection conversion is reported with property == None.'
          anchor = '    return PUGL_SUCCESS; // Ignore unknown selection\n  }\n\n  PuglInternals* const impl      = view->impl;\n'
          insert = (
              '    return PUGL_SUCCESS; // Ignore unknown selection\n'
              '  }\n\n'
              '  // A failed selection conversion is reported with property == None.\n'
              '  // Never pass atom 0 to XGetWindowProperty.  Clear stale general\n'
              '  // clipboard state, while leaving drag-and-drop state unchanged.\n'
              '  if (event->property == None) {\n'
              '    if (selection == atoms->CLIPBOARD) {\n'
              '      clearX11Clipboard(board);\n'
              '    }\n'
              '    return PUGL_SUCCESS;\n'
              '  }\n\n'
              '  PuglInternals* const impl      = view->impl;\n'
          )
          if marker not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one handleSelectionNotify insertion point, found {text.count(anchor)}')
              path.write_text(text.replace(anchor, insert, 1))
          PY

            rm -f .github/workflows/apply-x11-empty-clipboard-fix.yml
            git diff --check
            grep -A15 -B5 'failed selection conversion' src/x11.c

            git add -A
            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m 'X11: ignore failed selection conversions'
            if git push origin HEAD:fix/x11-empty-clipboard; then
              exit 0
            fi

            echo "Branch moved concurrently, retrying on the latest remote head" >&2
            sleep 2
          done

          echo "Failed to persist the focused X11 fix after concurrent branch rewrites" >&2
          exit 1
