name: Fix WebGL restack

on:
  push:
    branches: [feature/emscripten-webgl]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'stage WebGL restack correction')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/emscripten-webgl
          fetch-depth: 0
      - name: Restore current Emscripten core source set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('meson.build')
          text = path.read_text()
          old = "  platform_sources = files('src/emscripten.c')\n"
          new = "  platform_sources = files('src/emscripten.c', 'src/emscripten_events.c')\n"
          if text.count(old) != 1:
              raise SystemExit('Emscripten source marker changed')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit correction as bot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meson.build
          git commit -m 'Restore Emscripten event source in WebGL build' -m 'GREEN correction for #16: preserve the current #14 input/event translation source when enabling WebGL so every Emscripten target links the platform lifecycle cleanly.'
          git push origin HEAD:feature/emscripten-webgl
