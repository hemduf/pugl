# SPDX-License-Identifier: 0BSD OR ISC
name: Apply Win DnD review patch

on:
  push:
    branches:
      - fix/windows-dnd-review-findings

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          git fetch origin fix/windows-dnd-review-findings
          git reset --hard origin/fix/windows-dnd-review-findings
          python scripts/apply_win_dnd_review.py
          rm -f scripts/apply_win_dnd_review.py
          rm -f .github/workflows/apply-win-dnd-review.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Windows drag-and-drop review findings'
          git push origin HEAD:fix/windows-dnd-review-findings
