#
# Meson >= 0.56 is required for the project-options section below.
# Typical usage:
#   meson setup build-wasm --cross-file build-aux/emscripten.ini
#   meson compile -C build-wasm

[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
default_library = 'static'
c_args = ['-D_POSIX_C_SOURCE=200809L']

[project options]
bindings_cpp = 'disabled'
cairo = 'disabled'
docs = 'disabled'
examples = 'disabled'
install = 'disabled'
opengl = 'disabled'
stub = true
tests = 'disabled'
vulkan = 'disabled'
