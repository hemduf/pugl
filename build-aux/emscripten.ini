#
# This machine file intentionally contains only toolchain/host settings so it
# can also be reused by Meson superprojects that embed Pugl as a subproject.
#
# Typical standalone Pugl usage:
#   meson setup build-wasm --cross-file build-aux/emscripten.ini \
#     -Dbindings_cpp=disabled -Dcairo=disabled -Ddocs=disabled \
#     -Dexamples=disabled -Dinstall=disabled -Dopengl=disabled \
#     -Dstub=true -Dtests=disabled -Dvulkan=disabled
#   meson compile -C build-wasm

[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
default_library = 'static'
c_args = ['-D_POSIX_C_SOURCE=200809L']
